<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <style>html { background: #f7f8f5; color: #1d2522; } html[data-theme="dark"] { background: #212121; color: #ececec; color-scheme: dark; }</style>
    <script>
      (() => {
        let preference;
        try {
          preference = localStorage.getItem('theme');
          const legacy = localStorage.getItem('shop-theme');
          if (['light', 'dark'].includes(legacy)) {
            preference = legacy;
            localStorage.setItem('theme', preference);
          }
          localStorage.removeItem('shop-theme');
        } catch {}
        document.documentElement.dataset.theme = preference === 'dark' || preference === 'light'
          ? preference
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      })();
    </script>
    <title>shop — техника Apple</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
